<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surraucao 26/27 — Regia Asta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1712; --panel:#0f221a; --panel2:#132a20; --line:rgba(255,255,255,.09);
  --text:#eaf2ec; --dim:#8ba498; --accent:#d7a33e; --accent-dim:#8a6c2c;
  --target:#33c46e; --target-bg:rgba(51,196,110,.16);
  --out-bg:#0c1712; --out-text:#3c4b42;
  --danger:#e2574c; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 20% -10%, #123125 0%, var(--bg) 55%);
  color:var(--text); font-family:'Inter',system-ui,sans-serif; font-size:14px;
  min-height:100vh; padding-bottom:60px;
}
h1,h2,h3,.disp{font-family:'Archivo Narrow',system-ui,sans-serif; letter-spacing:.02em}
::selection{background:var(--accent); color:#1a1305}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px;
  padding:10px 16px; background:rgba(10,23,18,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.brand{font-weight:700; font-size:17px; margin-right:auto; white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:999px; border:1px solid var(--line)}
.tab{
  border:none; background:transparent; color:var(--dim); font:inherit; font-weight:600;
  padding:7px 14px; border-radius:999px; cursor:pointer; font-size:13px; transition:.15s;
}
.tab.active{background:var(--accent); color:#1a1305}
.tab:not(.active):hover{color:var(--text); background:rgba(255,255,255,.06)}
.budget{
  display:flex; align-items:baseline; gap:6px; background:var(--panel); border:1px solid var(--line);
  border-radius:999px; padding:7px 16px; font-weight:600; white-space:nowrap;
}
.budget .num{font-family:'Archivo Narrow'; font-size:19px; color:var(--target)}
.budget .num.neg{color:var(--danger)}
.budget .lbl{color:var(--dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em}
.iconbtn{
  width:36px; height:36px; border-radius:999px; border:1px solid var(--line); background:var(--panel);
  color:var(--dim); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px;
  transition:.12s; flex-shrink:0;
}
.iconbtn:hover{color:var(--accent); border-color:var(--accent)}

/* ---------- layout ---------- */
main{max-width:1180px; margin:0 auto; padding:18px 16px 0}
.page{display:none}
.page.active{display:block; animation:fade .25s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
.page-head{margin:6px 0 12px}
.page-head h2{margin:0 0 3px; font-size:22px}
.page-head p{margin:0; color:var(--dim); font-size:13px}
.quicknav{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.quicknav .qlbl{color:var(--dim); font-size:12px; align-self:center; margin-right:2px}
.qpill{
  background:var(--panel); border:1px solid var(--line); color:var(--dim); font:inherit; font-size:12px;
  padding:5px 12px; border-radius:999px; cursor:pointer; transition:.12s; white-space:nowrap;
}
.qpill:hover{color:var(--accent); border-color:var(--accent)}
.qpill.last{color:var(--target); border-color:rgba(51,196,110,.35)}
[id^="t-"], .tbl-wrap{scroll-margin-top:76px}

/* ---------- reparto block ---------- */
.reparto{margin-bottom:22px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--panel)}
.reparto > .rhead{
  padding:10px 14px; background:linear-gradient(90deg,var(--panel2),var(--panel));
  border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
}
.rhead h3{margin:0; font-size:15px; color:var(--accent)}
.rhead .count{font-size:12px; color:var(--dim)}
.tiers{display:flex; flex-wrap:wrap}
.tier{flex:1 1 200px; min-width:170px; border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.tier:last-child{border-right:none}
.tier h4{
  margin:0; padding:6px 12px; font-size:11px; letter-spacing:.05em; color:var(--dim);
  background:rgba(255,255,255,.03); font-weight:600; text-transform:uppercase;
}
.plist{list-style:none; margin:0; padding:4px}
.prow{
  display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px; cursor:pointer;
  transition:background .12s, color .12s; user-select:none;
}
.prow:hover:not(.out){background:rgba(255,255,255,.05)}
.prow.target{background:var(--target-bg); color:var(--target)}
.prow.out{color:var(--out-text); cursor:default}
.prow.out .pname{text-decoration:line-through}
.pname{flex:1; font-size:13.5px}
.flag{
  width:19px; height:19px; border-radius:5px; border:1.5px solid var(--dim); background:transparent;
  cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0;
  transition:.12s; color:transparent;
}
.flag:hover{border-color:var(--danger)}
.prow.out .flag{background:var(--danger); border-color:var(--danger); color:#1a0a08}
.prow.out .flag svg{display:block}
.flag svg{width:11px; height:11px}
.prow.purchased .flag{opacity:.35; cursor:not-allowed}

/* ---------- tabella acquisti ---------- */
.tbl-wrap{margin:18px 0 30px}
.tbl-wrap .thead2{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.tbl-wrap h3{margin:0; font-size:15px}
.subtotal{font-size:12.5px; color:var(--dim)}
.subtotal b{color:var(--text)}
table.acq{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
table.acq th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim);
  padding:8px 10px; background:var(--panel2); border-bottom:1px solid var(--line); font-weight:600;
}
table.acq td{padding:5px 8px; border-bottom:1px solid var(--line); font-size:13.5px}
table.acq tr:last-child td{border-bottom:none}
table.acq tr:nth-child(even) td{background:rgba(255,255,255,.02)}
table.acq input, table.acq select{
  width:100%; background:transparent; border:1px solid transparent; color:var(--text); font:inherit;
  padding:5px 6px; border-radius:6px; transition:.12s;
}
table.acq input:hover, table.acq select:hover{border-color:var(--line)}
table.acq input:focus, table.acq select:focus{outline:none; border-color:var(--accent); background:rgba(255,255,255,.04)}
table.acq input[type=number]{width:70px}
.col-n{width:32px; color:var(--dim); text-align:center; font-size:12px}
.col-del{width:34px}
.del-btn{
  width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:transparent;
  color:var(--dim); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.12s;
}
.del-btn:hover{border-color:var(--danger); color:var(--danger); background:rgba(226,87,76,.1)}
.empty-row td{color:var(--dim); text-align:center; padding:16px; font-style:italic}
.addrow-btn{
  margin-top:10px; background:transparent; border:1px dashed var(--line); color:var(--dim);
  padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; font-size:12.5px; transition:.12s;
}
.addrow-btn:hover{border-color:var(--accent); color:var(--accent)}

/* ---------- riepilogo pagina 4 ---------- */
.summary-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:20px}
.scard{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px}
.scard .v{font-family:'Archivo Narrow'; font-size:26px; font-weight:700}
.scard .l{color:var(--dim); font-size:12px; margin-top:2px}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(4,10,7,.72); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:16px;
}
.overlay.show{display:flex}
.modal{
  background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:24px;
  width:100%; max-width:340px; text-align:center; animation:pop .18s ease;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
@keyframes pop{from{transform:scale(.94); opacity:0} to{transform:scale(1); opacity:1}}
.modal .icon{font-size:30px; margin-bottom:6px}
.modal h3{margin:0 0 4px; font-size:17px}
.modal .pname2{color:var(--accent); font-weight:700}
.modal p{color:var(--dim); font-size:13px; margin:4px 0 16px}
.modal input{
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); font:inherit;
  font-size:20px; text-align:center; padding:10px; border-radius:9px; margin-bottom:16px;
}
.modal input:focus{outline:none; border-color:var(--accent)}
.modal-actions{display:flex; gap:8px}
.btn{flex:1; padding:11px; border-radius:9px; border:none; font:inherit; font-weight:600; cursor:pointer; font-size:13.5px; transition:.12s}
.btn.confirm{background:var(--target); color:#06210f}
.btn.confirm:hover{filter:brightness(1.08)}
.btn.cancel{background:transparent; border:1px solid var(--line); color:var(--dim)}
.btn.cancel:hover{color:var(--text); border-color:var(--dim)}

.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--panel2); border:1px solid var(--target); color:var(--target); padding:10px 18px;
  border-radius:999px; font-size:13px; font-weight:600; z-index:200; transition:.25s; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .brand{font-size:15px}
  .topbar{padding:8px 10px}
  .tab{padding:6px 10px; font-size:12px}
  .budget{padding:6px 12px}
  .budget .num{font-size:16px}
  main{padding:14px 10px 0}
  .tier{flex:1 1 100%; border-right:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Fasce <span>Classic</span></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-page="1">Por / Dif</button>
    <button class="tab" data-page="2">Centrocampo</button>
    <button class="tab" data-page="3">Attacco</button>
    <button class="tab" data-page="4">Rosa</button>
  </div>
  <div class="budget"><span class="lbl">Residuo</span><span class="num" id="budgetNum">500</span></div>
  <button class="iconbtn" id="btnSave" title="Salva progresso su file">💾</button>
  <button class="iconbtn" id="btnLoad" title="Carica progresso da file">📂</button>
  <input type="file" id="loadFile" accept="application/json" style="display:none">
</div>

<main id="main"></main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="icon">🏆</div>
    <h3>Complimenti, hai appena comprato</h3>
    <p class="pname2" id="modalName">—</p>
    <input type="number" id="modalCredits" placeholder="Crediti spesi" min="0" inputmode="numeric">
    <div class="modal-actions">
      <button class="btn cancel" id="btnCancel">Annulla</button>
      <button class="btn confirm" id="btnConfirm">Conferma</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script id="data" type="application/json">{"POR":[["TOP",["Vicario","Martinez","Meret","Svilar"]],["I",["Butez","Carnesecchi","Maignan"]],["II",["De Gea","Manolas","Okoye","Skorupski"]],["III",["Bijlow","Muric","Corvi","Caprile"]],["Titolari",["Falcone","Palmisani","Stankovic","Perri","Tornqvist"]],["Scommesse",["Provedel","Sanchez"]]],"DIF":[["TOP",["Bremer","Dimarco","Wesley"]],["I",["Akanji","Batoni","Bisseck","Chalobah","Gila","Kalulu","Mancini","Molina","Ndicka","Pavlovic"]],["II",["Bartesaghi","Cambiaso","Celik","Di Lorenzo","Lucumi","Ostigaard","Ramon","Rrahmani","Solet","Spence","Spinazzola","Stones","Zappacosta"]],["III",["Bernasconi","Couto","Dragusin","Gabbia","Heggem","Hermoso","Jimenez","Kamara","Kempf","Kristensen","Miranda","Scalvini","Tavares","Tiago Gabriel","Valdepenas","Valle","Vasquez","Zortea"]],["Titolari",["Abankwah","Bella Kotchap","Birindelli","Bracaglia","Calvani","Carboni","Cinquegrano","Coco","Comuzzo","Delprato","Doekhi","Doig","Gaspar","Sutalo","Valeri","Vojvoda","Hainaut","Idzes","Ismajili","Kouadio","Leysen","Mangas","Marcandalli","Mina","Monterisi","Oyono","Provstgaard","Rodriguez","Schingtienne","Troilo","Viery"]],["Scommesse",["Buongiorno","Carlos Augusto","De Winter","Lulli","Tomori"]]],"CEN":[["TOP",["Baturina","Calhanoglu","Frattesi","McTominay","Orsolini","Nico Paz","Pulisic"]],["I",["Atta","Barella","Da Cunha","De Bruyne","Ekkelenkamp","Rabiot","Zaccagni","Zielinski","Zaniolo"]],["II",["Alajbegovic","Bernardeschi","Chukweze","Conceicao","Cristante","Douglas Luiz","Ederson","Gaetano","Gonzalez","Goncalves","Gudsmundsson","Isaksen","Kessie","Kone M","Locatelli","Loftus","Mastantuono","Mckennie","Modric","Mora","Moreira","Odgaard","Perrone","Politano","Rodriguez","Rowe","Saelemakers","Samardzic","Taylor K","Vlasic"]],["III",["Adzic","Baldanzi","Bernabe","Cacciamani","Calò","Cambiaghi","Colpani","Ferguson","Jones","Mandragora","Musah","Njie","Oulai","Pasalic","Piotrowski","Zambo"]],["Titolari",["Adopo","Akisanmiro","Bakola","Basic","Belahyane","Busio","Casadei","Coulibaly","Ellertsson","Fagioli","Fazzini","Fitz Jim","Folorunsho","Gineitis","Gorter","Jashari","Karlstrom","Keita","Lobotka","Masini","Matic","Ndour","Ngom","Ordonez","Perez","Pierotti","Romano","Rovella","Schmid","Winks"]],["Scommesse",["Cissè","Diouf","El Sharawy","Elmas","Koopmeiners","Liberali","Pellegrini","Sucic","Vergara","Volpato"]]],"ATT":[["TOP",["Malen","Lautaro"]],["I",["Berardi","Douvikas","Hojlund","Kean","Kolo Muani","Ramos","Scamacca","Thuram"]],["II",["Beto","Davis K","Dovbyk","Dybala","Krstovic","Lauriente","Pinamonti","Raspadori","Simeone","Varela","Woltemade"]],["III",["Adams C","Boga","Colombo","Diao","Nzola","Pellegrino","Piccoli","Raimondo","Soulé"]],["Titolari",["Adams A","Bowie","Cutrone","CDK","Geubbels","Kvernadze","Maldini","Ndri","Yeboah"]],["Scommesse",["Bobcek","Bonny","Castro","Pio","Santos","Yildiz"]]]}</script>
<script>const DATA = JSON.parse(document.getElementById('data').textContent);
const BUDGET = 500;
const REP_LABEL = {POR:'Portieri', DIF:'Difensori', CEN:'Centrocampisti', ATT:'Attaccanti'};
const TIER_LABEL = {TOP:'Top', I:'1ª fascia', II:'2ª fascia', III:'3ª fascia', Titolari:'Titolari', Scommesse:'Scommesse'};
const PAGES = [
  {id:1, reparti:['POR','DIF'], title:'Portieri e Difensori', sub:'Spunta chi esce, doppio clic per comprare'},
  {id:2, reparti:['CEN'], title:'Centrocampisti', sub:'Spunta chi esce, doppio clic per comprare'},
  {id:3, reparti:['ATT'], title:'Attaccanti', sub:'Spunta chi esce, doppio clic per comprare'},
];

// stato: mappa key -> {out:bool, target:bool}   key = REP|tier|nome
const status = {};
// acquisti: [{id, nome, ruolo, speso, key}]
let purchases = [];
let uid = 1;
let pendingKey = null;

function keyOf(rep, tier, nome){ return rep+'|'+tier+'|'+nome; }

function buildChecklistHTML(){
  let html = '';
  for(const rep of ['POR','DIF','CEN','ATT']){
    const tiers = DATA[rep];
    const total = tiers.reduce((s,t)=>s+t[1].length,0);
    let tiersHtml = '';
    for(const [tier, names] of tiers){
      let rows = '';
      for(const nome of names){
        const k = keyOf(rep,tier,nome);
        rows += `<li class="prow" data-key="${k}" data-rep="${rep}" data-tier="${tier}" data-nome="${esc(nome)}">
          <span class="pname">${esc(nome)}</span>
          <button class="flag" title="Segna come chiamato/uscito" data-act="flag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L19 7"/></svg>
          </button>
        </li>`;
      }
      tiersHtml += `<div class="tier" id="t-${rep}-${tier}"><h4>${TIER_LABEL[tier]||tier}</h4><ul class="plist">${rows}</ul></div>`;
    }
    html += `<section class="reparto" data-reparto-block="${rep}">
      <div class="rhead"><h3>${REP_LABEL[rep]}</h3><span class="count">${total} giocatori</span></div>
      <div class="tiers">${tiersHtml}</div>
    </section>`;
  }
  return html;
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderShell(){
  const main = document.getElementById('main');
  const checklist = buildChecklistHTML();
  // il checklist completo viene creato una sola volta in un contenitore nascosto,
  // poi i blocchi reparto vengono spostati (non clonati) nelle pagine giuste.
  const holder = document.createElement('div');
  holder.innerHTML = checklist;
  const blocks = {};
  holder.querySelectorAll('[data-reparto-block]').forEach(b=>{
    blocks[b.getAttribute('data-reparto-block')] = b;
  });

  let html = '';
  PAGES.forEach(p=>{
    let nav = '<div class="quicknav"><span class="qlbl">Vai a:</span>';
    p.reparti.forEach(rep=>{
      DATA[rep].forEach(([tier])=>{
        nav += `<button class="qpill" data-target="#t-${rep}-${tier}">${REP_LABEL[rep]} \u00b7 ${TIER_LABEL[tier]||tier}</button>`;
      });
    });
    nav += `<button class="qpill last" data-target="#acquisti-${p.id}">Giocatori presi</button></div>`;
    html += `<div class="page" id="page${p.id}">
      <div class="page-head"><h2>${p.title}</h2><p>${p.sub}</p></div>
      ${nav}
      <div class="checklist-slot" id="slot${p.id}"></div>
      <div class="tbl-wrap" id="acquisti-${p.id}">
        <div class="thead2"><h3>Presi in questo reparto</h3><div class="subtotal">Speso qui: <b id="sub${p.id}">0</b> cr.</div></div>
        <div id="tblslot${p.id}"></div>
        <button class="addrow-btn" data-addrow="${p.id}">+ Aggiungi riga manuale</button>
      </div>
    </div>`;
  });
  html += `<div class="page" id="page4">
    <div class="page-head"><h2>Rosa completata</h2><p>Tutti i giocatori acquistati — modifica, sposta o elimina liberamente</p></div>
    <div class="summary-cards">
      <div class="scard"><div class="v" id="sumBought">0</div><div class="l">Giocatori presi</div></div>
      <div class="scard"><div class="v" id="sumSpent">0</div><div class="l">Crediti spesi</div></div>
      <div class="scard"><div class="v" id="sumLeft">500</div><div class="l">Crediti residui</div></div>
    </div>
    <div id="tblslot4"></div>
    <button class="addrow-btn" data-addrow="4">+ Aggiungi riga manuale</button>
  </div>`;
  main.innerHTML = html;

  PAGES.forEach(p=>{
    const slot = document.getElementById('slot'+p.id);
    p.reparti.forEach(rep=> slot.appendChild(blocks[rep]));
  });
}

function renderTables(){
  autosave();
  // pagine 1-3: filtra per reparto di appartenenza
  PAGES.forEach(p=>{
    const rows = purchases.filter(pu => p.reparti.includes(pu.ruolo));
    document.getElementById('tblslot'+p.id).innerHTML = tableHTML(rows, false);
    document.getElementById('sub'+p.id).textContent = rows.reduce((s,r)=>s+(+r.speso||0),0);
  });
  // pagina 4: tutto
  document.getElementById('tblslot4').innerHTML = tableHTML(purchases, true);
  const totSpent = purchases.reduce((s,r)=>s+(+r.speso||0),0);
  document.getElementById('sumBought').textContent = purchases.length;
  document.getElementById('sumSpent').textContent = totSpent;
  document.getElementById('sumLeft').textContent = BUDGET - totSpent;
  const left = BUDGET - totSpent;
  const bn = document.getElementById('budgetNum');
  bn.textContent = left;
  bn.classList.toggle('neg', left < 0);
}

function tableHTML(rows, showRepSelect){
  if(!rows.length) return `<table class="acq"><thead><tr><th class="col-n">#</th><th>Giocatore</th><th>Ruolo</th><th>Spesi</th><th>Residuo</th><th class="col-del"></th></tr></thead>
    <tbody><tr class="empty-row"><td colspan="6">Nessun giocatore ancora — doppio clic su un nome per comprarlo</td></tr></tbody></table>`;
  let running = BUDGET;
  const trs = rows.map((r,i)=>{
    running -= (+r.speso||0);
    const repOpts = Object.keys(REP_LABEL).map(k=>`<option value="${k}" ${k===r.ruolo?'selected':''}>${k}</option>`).join('');
    return `<tr data-id="${r.id}">
      <td class="col-n">${i+1}</td>
      <td><input type="text" value="${esc(r.nome)}" data-f="nome"></td>
      <td><select data-f="ruolo">${repOpts}</select></td>
      <td><input type="number" value="${r.speso}" min="0" data-f="speso"></td>
      <td>${running}</td>
      <td class="col-del"><button class="del-btn" data-del="${r.id}" title="Elimina">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button></td>
    </tr>`;
  }).join('');
  return `<table class="acq"><thead><tr><th class="col-n">#</th><th>Giocatore</th><th>Ruolo</th><th>Spesi</th><th>Residuo</th><th class="col-del"></th></tr></thead>
    <tbody>${trs}</tbody></table>`;
}

function applyStatusToDOM(){
  document.querySelectorAll('.prow').forEach(row=>{
    const k = row.getAttribute('data-key');
    const s = status[k];
    row.classList.toggle('out', !!(s && s.out));
    row.classList.toggle('target', !!(s && s.target && !(s&&s.out)));
    row.classList.toggle('purchased', !!(s && s.purchased));
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------------- eventi checklist ----------------
document.addEventListener('click', e=>{
  const flag = e.target.closest('.flag');
  if(flag){
    const row = flag.closest('.prow');
    if(row.classList.contains('purchased')) return;
    const k = row.getAttribute('data-key');
    status[k] = status[k] || {};
    status[k].out = !status[k].out;
    if(status[k].out) status[k].target = false;
    applyStatusToDOM(); autosave();
    return;
  }
  const nameEl = e.target.closest('.prow .pname');
  if(nameEl){
    const row = nameEl.closest('.prow');
    if(row.classList.contains('out') || row.classList.contains('purchased')) return;
    const k = row.getAttribute('data-key');
    status[k] = status[k] || {};
    status[k].target = !status[k].target;
    applyStatusToDOM(); autosave();
    return;
  }
  const del = e.target.closest('[data-del]');
  if(del){
    const id = +del.getAttribute('data-del');
    const p = purchases.find(x=>x.id===id);
    if(p && p.key && status[p.key]){
      status[p.key].out = false; status[p.key].target = false; status[p.key].purchased = false;
    }
    purchases = purchases.filter(x=>x.id!==id);
    applyStatusToDOM(); renderTables();
    return;
  }
  const add = e.target.closest('[data-addrow]');
  if(add){
    const pid = add.getAttribute('data-addrow');
    const rep = pid==='4' ? 'POR' : PAGES.find(p=>p.id==pid).reparti[0];
    purchases.push({id:uid++, nome:'', ruolo:rep, speso:0, key:null});
    renderTables();
    return;
  }
});

document.addEventListener('dblclick', e=>{
  const nameEl = e.target.closest('.prow .pname');
  if(!nameEl) return;
  const row = nameEl.closest('.prow');
  if(row.classList.contains('out') || row.classList.contains('purchased')) return;
  pendingKey = row.getAttribute('data-key');
  document.getElementById('modalName').textContent = row.getAttribute('data-nome');
  const inp = document.getElementById('modalCredits');
  inp.value = '';
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>inp.focus(), 80);
});

document.getElementById('btnCancel').onclick = ()=> document.getElementById('overlay').classList.remove('show');
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') e.currentTarget.classList.remove('show'); });

document.getElementById('btnConfirm').onclick = ()=>{
  if(!pendingKey) return;
  const [rep, tier, nome] = pendingKey.split('|');
  const credInp = document.getElementById('modalCredits');
  const cred = Math.max(0, +credInp.value || 0);
  status[pendingKey] = status[pendingKey] || {};
  status[pendingKey].out = true; status[pendingKey].purchased = true; status[pendingKey].target = false;
  purchases.push({id:uid++, nome, ruolo:rep, speso:cred, key:pendingKey});
  applyStatusToDOM(); renderTables();
  document.getElementById('overlay').classList.remove('show');
  toast('Acquistato: ' + nome + ' — ' + cred + ' cr.');
  pendingKey = null;
};

// input dinamici nelle tabelle (delega)
document.addEventListener('input', e=>{
  const f = e.target.getAttribute('data-f');
  if(!f) return;
  const tr = e.target.closest('tr');
  const id = +tr.getAttribute('data-id');
  const p = purchases.find(x=>x.id===id);
  if(!p) return;
  if(f==='ruolo'){
    p.ruolo = e.target.value;
    renderTables();
    return;
  }
  p[f] = e.target.value;
  renderTables();
});

// ---------------- nav "vai a" ----------------
document.addEventListener('click', e=>{
  const q = e.target.closest('.qpill');
  if(!q) return;
  const el = document.querySelector(q.getAttribute('data-target'));
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
});

// ---------------- salvataggio ----------------
const LS_KEY = 'surraucao_asta_classic_v1';

function snapshot(){ return {status, purchases, uid}; }

function restore(obj){
  if(!obj) return false;
  Object.keys(status).forEach(k=>delete status[k]);
  Object.assign(status, obj.status||{});
  purchases = obj.purchases||[];
  uid = obj.uid||1;
  return true;
}

function autosave(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(snapshot())); }catch(e){ /* storage non disponibile: nessun problema, si usa Salva su file */ }
}

function autoload(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return restore(JSON.parse(raw));
  }catch(e){ /* ignorato */ }
  return false;
}

document.getElementById('btnSave').onclick = ()=>{
  const blob = new Blob([JSON.stringify(snapshot(), null, 0)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'asta_classic_progresso.json';
  a.click();
  toast('Progresso salvato su file');
};

document.getElementById('btnLoad').onclick = ()=> document.getElementById('loadFile').click();
document.getElementById('loadFile').onchange = e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      restore(JSON.parse(reader.result));
      applyStatusToDOM(); renderTables(); autosave();
      toast('Progresso caricato');
    }catch(err){ toast('File non valido'); }
  };
  reader.readAsText(file);
  e.target.value = '';
};

// ---------------- tabs ----------------
document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b===btn));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page'+btn.getAttribute('data-page')));
});

// ---------------- init ----------------
const hadSaved = autoload();
renderShell();
applyStatusToDOM();
renderTables();
document.getElementById('page1').classList.add('active');
if(hadSaved) toast('Progresso precedente ripristinato');
</script>
</body>
