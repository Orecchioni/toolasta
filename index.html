<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surraucao 26/27 — Regia Asta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1712; --panel:#0f221a; --panel2:#132a20; --line:rgba(255,255,255,.09);
  --text:#eaf2ec; --dim:#8ba498; --accent:#d7a33e; --accent-dim:#8a6c2c;
  --target:#33c46e; --target-bg:rgba(51,196,110,.16);
  --out-bg:#0c1712; --out-text:#7c9389;
  --danger:#e2574c; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 20% -10%, #123125 0%, var(--bg) 55%);
  color:var(--text); font-family:'Inter',system-ui,sans-serif; font-size:14px;
  min-height:100vh; padding-bottom:60px;
}
h1,h2,h3,.disp{font-family:'Archivo Narrow',system-ui,sans-serif; letter-spacing:.02em}
::selection{background:var(--accent); color:#1a1305}

/* ---------- schermata iniziale ---------- */
.setup{
  position:fixed; inset:0; z-index:300; display:none; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(900px 600px at 50% 0%, #16402f 0%, #071009 60%);
}
.setup.show{display:flex}
.setup-card{
  width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line);
  border-radius:16px; padding:30px 26px; box-shadow:0 30px 80px rgba(0,0,0,.55); animation:pop .2s ease;
}
.setup-logo{
  width:54px; height:54px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-size:27px; background:linear-gradient(140deg,var(--accent),var(--accent-dim)); margin-bottom:14px;
}
.setup-card h1{margin:0 0 4px; font-size:25px}
.setup-card > p{margin:0 0 22px; color:var(--dim); font-size:13.5px}
.field{margin-bottom:16px}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px}
.field input{
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); font:inherit;
  font-size:15px; padding:11px 13px; border-radius:9px; transition:.12s;
}
.field input:focus{outline:none; border-color:var(--accent)}
.field input::placeholder{color:#5d726a}
.setup-err{color:var(--danger); font-size:12.5px; min-height:17px; margin-bottom:6px}
.setup-actions{display:flex; gap:8px}

/* ---------- top bar ---------- */
.app{display:none}
.app.show{display:block}
.topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px;
  padding:10px 16px; background:rgba(10,23,18,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.identity{
  display:flex; align-items:center; gap:9px; margin-right:auto; background:transparent;
  border:1px solid transparent; border-radius:12px; padding:4px 8px 4px 4px; cursor:pointer;
  font:inherit; color:inherit; text-align:left; transition:.12s;
}
.identity:hover{border-color:var(--line); background:var(--panel)}
.avatar{
  width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-family:'Archivo Narrow',system-ui,sans-serif; font-weight:700; font-size:14px; flex-shrink:0;
  background:linear-gradient(140deg,var(--accent),var(--accent-dim)); color:#1a1305; letter-spacing:.02em;
}
.avatar.coach{
  width:17px; height:17px; border-radius:999px; font-size:10px;
  background:var(--panel2); border:1px solid var(--line); color:var(--dim);
}
.idtext{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.idteam{font-family:'Archivo Narrow',system-ui,sans-serif; font-weight:700; font-size:16px; white-space:nowrap}
.idcoach{display:flex; align-items:center; gap:5px; color:var(--dim); font-size:11.5px; white-space:nowrap}
.tabs{display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:999px; border:1px solid var(--line)}
.tab{
  border:none; background:transparent; color:var(--dim); font:inherit; font-weight:600;
  padding:7px 14px; border-radius:999px; cursor:pointer; font-size:13px; transition:.15s;
}
.tab.active{background:var(--accent); color:#1a1305}
.tab:not(.active):hover{color:var(--text); background:rgba(255,255,255,.06)}
.budget{
  display:flex; align-items:baseline; gap:6px; background:var(--panel); border:1px solid var(--line);
  border-radius:999px; padding:7px 16px; font-weight:600; white-space:nowrap;
}
.budget .num{font-family:'Archivo Narrow'; font-size:19px; color:var(--target)}
.budget .num.neg{color:var(--danger)}
.budget .lbl{color:var(--dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em}
.iconbtn{
  width:36px; height:36px; border-radius:999px; border:1px solid var(--line); background:var(--panel);
  color:var(--dim); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px;
  transition:.12s; flex-shrink:0;
}
.iconbtn:hover{color:var(--accent); border-color:var(--accent)}

/* ---------- barra fasce ---------- */
.subbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 16px; border-bottom:1px solid var(--line); background:rgba(15,34,26,.5);
}
.subbar.hide{display:none}
.sublbl{color:var(--dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:600}
.seg{display:flex; gap:3px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px}
.segb{
  border:none; background:transparent; color:var(--dim); font:inherit; font-weight:600; font-size:12.5px;
  padding:5px 13px; border-radius:999px; cursor:pointer; transition:.15s;
}
.segb.active{background:var(--target); color:#06210f}
.segb:not(.active):hover{color:var(--text)}
.ghostbtn{
  background:transparent; border:1px solid var(--line); color:var(--dim); font:inherit; font-size:12.5px;
  padding:6px 13px; border-radius:999px; cursor:pointer; transition:.12s; white-space:nowrap;
}
.ghostbtn:hover{border-color:var(--accent); color:var(--accent)}
.subinfo{color:var(--dim); font-size:12px; margin-left:auto}

/* ---------- layout ---------- */
main{max-width:1180px; margin:0 auto; padding:18px 16px 0}
.page{display:none}
.page.active{display:block; animation:fade .25s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
.page-head{margin:6px 0 12px}
.page-head h2{margin:0 0 3px; font-size:22px}
.page-head p{margin:0; color:var(--dim); font-size:13px}
.quicknav{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.quicknav .qlbl{color:var(--dim); font-size:12px; align-self:center; margin-right:2px}
.qpill{
  background:var(--panel); border:1px solid var(--line); color:var(--dim); font:inherit; font-size:12px;
  padding:5px 12px; border-radius:999px; cursor:pointer; transition:.12s; white-space:nowrap;
}
.qpill:hover{color:var(--accent); border-color:var(--accent)}
.qpill.last{color:var(--target); border-color:rgba(51,196,110,.35)}
[id^="t-"], .tbl-wrap{scroll-margin-top:120px}

/* ---------- reparto block ---------- */
.reparto{margin-bottom:22px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--panel)}
.reparto > .rhead{
  padding:10px 14px; background:linear-gradient(90deg,var(--panel2),var(--panel));
  border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
}
.rhead h3{margin:0; font-size:15px; color:var(--accent)}
.rhead .count{font-size:12px; color:var(--dim)}
.tiers{display:flex; flex-wrap:wrap}
.tier{flex:1 1 200px; min-width:190px; border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.tier:last-child{border-right:none}
.tier h4{
  margin:0; padding:6px 12px; font-size:11px; letter-spacing:.05em; color:var(--dim);
  background:rgba(255,255,255,.03); font-weight:600; text-transform:uppercase;
}
.plist{list-style:none; margin:0; padding:4px}
.prow{
  display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:7px; cursor:pointer;
  transition:background .12s, color .12s; user-select:none;
}
.prow:hover:not(.out){background:rgba(255,255,255,.05)}
.prow.target{background:var(--target-bg); color:var(--target)}
.prow.out{color:var(--out-text); cursor:default}
.prow.out .pname{text-decoration:line-through}
.pname{flex:1; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip{font-size:10px; color:var(--dim); letter-spacing:.04em; flex-shrink:0}
.qv{font-family:'Archivo Narrow',system-ui,sans-serif; font-size:12.5px; color:var(--accent); flex-shrink:0; min-width:18px; text-align:right}
.prow.out .chip, .prow.out .qv{color:inherit; opacity:.6}
.flag{
  width:19px; height:19px; border-radius:5px; border:1.5px solid var(--dim); background:transparent;
  cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0;
  transition:.12s; color:transparent;
}
.flag:hover{border-color:var(--danger)}
.prow.out .flag{background:var(--danger); border-color:var(--danger); color:#1a0a08}
.prow.out .flag svg{display:block}
.flag svg{width:11px; height:11px}
.prow.purchased .flag{opacity:.35; cursor:not-allowed}
.tier-empty{padding:22px 14px; color:var(--dim); font-size:13px; text-align:center; width:100%}
.tier-empty button{margin-top:10px}

/* ---------- tabella acquisti ---------- */
.tbl-wrap{margin:18px 0 30px}
.tbl-wrap .thead2{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.tbl-wrap h3{margin:0; font-size:15px}
.subtotal{font-size:12.5px; color:var(--dim)}
.subtotal b{color:var(--text)}
table.acq{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
table.acq th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim);
  padding:8px 10px; background:var(--panel2); border-bottom:1px solid var(--line); font-weight:600;
}
table.acq td{padding:5px 8px; border-bottom:1px solid var(--line); font-size:13.5px}
table.acq tr:last-child td{border-bottom:none}
table.acq tr:nth-child(even) td{background:rgba(255,255,255,.02)}
table.acq input, table.acq select{
  width:100%; background:transparent; border:1px solid transparent; color:var(--text); font:inherit;
  padding:5px 6px; border-radius:6px; transition:.12s;
}
table.acq input:hover, table.acq select:hover{border-color:var(--line)}
table.acq input:focus, table.acq select:focus{outline:none; border-color:var(--accent); background:rgba(255,255,255,.04)}
table.acq input[type=number]{width:70px}
.col-n{width:32px; color:var(--dim); text-align:center; font-size:12px}
.col-del{width:34px}
.del-btn{
  width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:transparent;
  color:var(--dim); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.12s;
}
.del-btn:hover{border-color:var(--danger); color:var(--danger); background:rgba(226,87,76,.1)}
.empty-row td{color:var(--dim); text-align:center; padding:16px; font-style:italic}
.addrow-btn{
  margin-top:10px; background:transparent; border:1px dashed var(--line); color:var(--dim);
  padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; font-size:12.5px; transition:.12s;
}
.addrow-btn:hover{border-color:var(--accent); color:var(--accent)}

/* ---------- riepilogo pagina 4 ---------- */
.summary-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:20px}
.scard{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px}
.scard .v{font-family:'Archivo Narrow'; font-size:26px; font-weight:700}
.scard .l{color:var(--dim); font-size:12px; margin-top:2px}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(4,10,7,.72); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:16px;
}
.overlay.show{display:flex}
.modal{
  background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:24px;
  width:100%; max-width:340px; text-align:center; animation:pop .18s ease;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
@keyframes pop{from{transform:scale(.94); opacity:0} to{transform:scale(1); opacity:1}}
.modal .icon{font-size:30px; margin-bottom:6px}
.modal h3{margin:0 0 4px; font-size:17px}
.modal .pname2{color:var(--accent); font-weight:700}
.modal p{color:var(--dim); font-size:13px; margin:4px 0 16px}
.modal input{
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); font:inherit;
  font-size:20px; text-align:center; padding:10px; border-radius:9px; margin-bottom:16px;
}
.modal input:focus{outline:none; border-color:var(--accent)}
.modal-actions{display:flex; gap:8px}
.btn{flex:1; padding:11px; border-radius:9px; border:none; font:inherit; font-weight:600; cursor:pointer; font-size:13.5px; transition:.12s}
.btn.confirm{background:var(--target); color:#06210f}
.btn.confirm:hover{filter:brightness(1.08)}
.btn.cancel{background:transparent; border:1px solid var(--line); color:var(--dim)}
.btn.cancel:hover{color:var(--text); border-color:var(--dim)}

/* ---------- editor fasce ---------- */
.modal.wide{max-width:820px; text-align:left; max-height:88vh; display:flex; flex-direction:column; padding:20px}
.mhead{display:flex; align-items:center; justify-content:space-between; gap:10px}
.mhead h3{font-size:19px}
.mhint{margin:4px 0 14px !important}
.ftabs{display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:999px; border:1px solid var(--line); align-self:flex-start; flex-wrap:wrap}
.frow{display:flex; gap:8px; margin:12px 0 10px; flex-wrap:wrap}
.frow input[type=search]{
  flex:1; min-width:150px; background:var(--bg); border:1px solid var(--line); color:var(--text);
  font:inherit; font-size:13.5px; padding:8px 12px; border-radius:8px; margin:0; text-align:left;
}
.frow input[type=search]:focus{outline:none; border-color:var(--accent)}
.frow select{
  background:var(--bg); border:1px solid var(--line); color:var(--text); font:inherit; font-size:13px;
  padding:8px 10px; border-radius:8px;
}
.ftable-wrap{overflow:auto; flex:1; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel)}
table.ftable{width:100%; border-collapse:collapse}
table.ftable th{
  position:sticky; top:0; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--dim); padding:8px 10px; background:var(--panel2); border-bottom:1px solid var(--line); font-weight:600;
}
table.ftable td{padding:4px 10px; border-bottom:1px solid var(--line); font-size:13.5px}
table.ftable tr:last-child td{border-bottom:none}
table.ftable tr.assigned td.fn{color:var(--target)}
td.fq{font-family:'Archivo Narrow',system-ui,sans-serif; color:var(--accent); width:44px}
td.fs, td.fa{color:var(--dim); font-size:12.5px; width:56px}
td.ff{width:150px}
table.ftable select{
  width:100%; background:transparent; border:1px solid var(--line); color:var(--text); font:inherit;
  font-size:13px; padding:4px 6px; border-radius:6px; cursor:pointer;
}
table.ftable select:focus{outline:none; border-color:var(--accent)}
table.ftable select.none{color:var(--dim)}
.mfoot{display:flex; align-items:center; gap:10px; margin-top:14px}
.mfoot .fcount{color:var(--dim); font-size:12.5px; margin-right:auto}
.mfoot .btn{flex:0 0 auto; padding:10px 22px}

.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--panel2); border:1px solid var(--target); color:var(--target); padding:10px 18px;
  border-radius:999px; font-size:13px; font-weight:600; z-index:200; transition:.25s; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .topbar{padding:8px 10px}
  .idteam{font-size:14px}
  .tab{padding:6px 10px; font-size:12px}
  .budget{padding:6px 12px}
  .budget .num{font-size:16px}
  .subbar{padding:8px 10px}
  .subinfo{margin-left:0; width:100%}
  main{padding:14px 10px 0}
  .tier{flex:1 1 100%; border-right:none}
  .modal.wide{padding:16px}
  td.ff{width:120px}
}
</style>
</head>
<body>

<!-- ---------- schermata iniziale ---------- -->
<div class="setup" id="setup">
  <div class="setup-card">
    <div class="setup-logo">⚽</div>
    <h1>La tua asta Classic</h1>
    <p>Due informazioni e sei pronto a partire.</p>
    <div class="field">
      <label for="inTeam">Come si chiama la tua squadra?</label>
      <input id="inTeam" type="text" placeholder="Es. Surraucao FC" maxlength="40" autocomplete="off">
    </div>
    <div class="field">
      <label for="inCoach">Come si chiama il tuo allenatore?</label>
      <input id="inCoach" type="text" placeholder="Es. Michele" maxlength="40" autocomplete="off">
    </div>
    <div class="setup-err" id="setupErr"></div>
    <div class="setup-actions">
      <button class="btn cancel" id="btnSetupCancel" hidden>Annulla</button>
      <button class="btn confirm" id="btnSetupOk">Entra nell'asta</button>
    </div>
  </div>
</div>

<!-- ---------- app ---------- -->
<div class="app" id="app">
  <div class="topbar">
    <button class="identity" id="identity" title="Modifica squadra e allenatore">
      <span class="avatar" id="avTeam">⚽</span>
      <span class="idtext">
        <span class="idteam" id="dispTeam">—</span>
        <span class="idcoach"><span class="avatar coach">👤</span><span id="dispCoach">—</span></span>
      </span>
    </button>
    <div class="tabs" id="tabs">
      <button class="tab active" data-page="1">Por / Dif</button>
      <button class="tab" data-page="2">Centrocampo</button>
      <button class="tab" data-page="3">Attacco</button>
      <button class="tab" data-page="4">Rosa</button>
    </div>
    <div class="budget"><span class="lbl">Residuo</span><span class="num" id="budgetNum">500</span></div>
    <button class="iconbtn" id="btnSave" title="Salva progresso su file">💾</button>
    <button class="iconbtn" id="btnLoad" title="Carica progresso da file">📂</button>
    <input type="file" id="loadFile" accept="application/json" style="display:none">
  </div>

  <div class="subbar" id="subbar">
    <span class="sublbl">Fasce</span>
    <div class="seg" id="fasceSeg">
      <button class="segb active" data-mode="suggested">Consigliate</button>
      <button class="segb" data-mode="custom">Le mie</button>
    </div>
    <button class="ghostbtn" id="btnEditFasce">✏️ Personalizza fasce</button>
    <span class="subinfo" id="fasceInfo"></span>
  </div>

  <main id="main"></main>
</div>

<!-- ---------- modale acquisto ---------- -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="icon">🏆</div>
    <h3>Complimenti, hai appena comprato</h3>
    <p class="pname2" id="modalName">—</p>
    <input type="number" id="modalCredits" placeholder="Crediti spesi" min="0" inputmode="numeric">
    <div class="modal-actions">
      <button class="btn cancel" id="btnCancel">Annulla</button>
      <button class="btn confirm" id="btnConfirm">Conferma</button>
    </div>
  </div>
</div>

<!-- ---------- editor fasce ---------- -->
<div class="overlay" id="fasceOverlay">
  <div class="modal wide">
    <div class="mhead">
      <h3>Le mie fasce</h3>
      <button class="iconbtn" id="btnCloseFasce" title="Chiudi">✕</button>
    </div>
    <p class="mhint">Assegna una fascia ai giocatori del listone Serie A 26/27. Chi resta senza fascia non compare nel tabellone.</p>
    <div class="ftabs" id="fRepTabs">
      <button class="tab active" data-rep="POR">Portieri</button>
      <button class="tab" data-rep="DIF">Difensori</button>
      <button class="tab" data-rep="CEN">Centrocampisti</button>
      <button class="tab" data-rep="ATT">Attaccanti</button>
    </div>
    <div class="frow">
      <input type="search" id="fSearch" placeholder="Cerca giocatore o squadra…" autocomplete="off">
      <select id="fFilter">
        <option value="">Tutti</option>
        <option value="assigned">Solo in fascia</option>
        <option value="free">Senza fascia</option>
      </select>
      <button class="ghostbtn" id="btnPrefill">Riprendi consigliate</button>
      <button class="ghostbtn" id="btnClearRep">Svuota reparto</button>
    </div>
    <div class="ftable-wrap">
      <table class="ftable" id="fTable"></table>
    </div>
    <div class="mfoot">
      <span class="fcount" id="fCount"></span>
      <button class="btn confirm" id="btnDoneFasce">Fatto</button>
    </div>
  </div>

    return TIERS.filter(t => buckets[t].length).map(t => [t, buckets[t]]);
  }
  return SUGGESTED[rep].map(([tier, names]) => [tier, names.map(nome => {
    const m = SUGMETA[rep][nome];
    return m ? {nome, team:m[1], q:m[2], key:m[0]+'|'+m[1]}
             : {nome, team:'', q:null, key:'?|'+normName(nome)};
  })]);
}

// ---------------- checklist ----------------
function buildChecklistHTML(){
  let html = '';
  for(const rep of REPS){
    const tiers = tiersFor(rep);
    const total = tiers.reduce((s,t) => s + t[1].length, 0);
    let tiersHtml = '';
    for(const [tier, players] of tiers){
      let rows = '';
      for(const p of players){
        rows += `<li class="prow" data-key="${esc(p.key)}" data-rep="${rep}" data-nome="${esc(p.nome)}">
          <span class="pname">${esc(p.nome)}</span>
          ${p.team ? `<span class="chip">${esc(p.team)}</span>` : ''}
          ${p.q != null ? `<span class="qv">${p.q}</span>` : ''}
          <button class="flag" title="Segna come chiamato/uscito" data-act="flag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L19 7"/></svg>
          </button>
        </li>`;
      }
      tiersHtml += `<div class="tier" id="t-${rep}-${tier}"><h4>${TIER_LABEL[tier]||tier}</h4><ul class="plist">${rows}</ul></div>`;
    }
    if(!total){
      tiersHtml = `<div class="tier-empty">Nessun giocatore in fascia per questo reparto.
        <br><button class="ghostbtn" data-open-fasce="1">✏️ Componi le tue fasce</button></div>`;
    }
    html += `<section class="reparto" data-reparto-block="${rep}">
      <div class="rhead"><h3>${REP_LABEL[rep]}</h3><span class="count">${total} giocatori</span></div>
      <div class="tiers">${tiersHtml}</div>
    </section>`;
  }
  return html;
}

function renderShell(){
  const main = document.getElementById('main');
  const holder = document.createElement('div');
  holder.innerHTML = buildChecklistHTML();
  const blocks = {};
  holder.querySelectorAll('[data-reparto-block]').forEach(b => {
    blocks[b.getAttribute('data-reparto-block')] = b;
  });

  let html = '';
  PAGES.forEach(p => {
    let nav = '<div class="quicknav"><span class="qlbl">Vai a:</span>';
    p.reparti.forEach(rep => {
      tiersFor(rep).forEach(([tier]) => {
        nav += `<button class="qpill" data-target="#t-${rep}-${tier}">${REP_LABEL[rep]} · ${TIER_LABEL[tier]||tier}</button>`;
      });
    });
    nav += `<button class="qpill last" data-target="#acquisti-${p.id}">Giocatori presi</button></div>`;
    html += `<div class="page" id="page${p.id}">
      <div class="page-head"><h2>${p.title}</h2><p>${p.sub}</p></div>
      ${nav}
      <div class="checklist-slot" id="slot${p.id}"></div>
      <div class="tbl-wrap" id="acquisti-${p.id}">
        <div class="thead2"><h3>Presi in questo reparto</h3><div class="subtotal">Speso qui: <b id="sub${p.id}">0</b> cr.</div></div>
        <div id="tblslot${p.id}"></div>
        <button class="addrow-btn" data-addrow="${p.id}">+ Aggiungi riga manuale</button>
      </div>
    </div>`;
  });
  html += `<div class="page" id="page4">
    <div class="page-head"><h2>Rosa completata</h2><p>Tutti i giocatori acquistati — modifica, sposta o elimina liberamente</p></div>
    <div class="summary-cards">
      <div class="scard"><div class="v" id="sumBought">0</div><div class="l">Giocatori presi</div></div>
      <div class="scard"><div class="v" id="sumSpent">0</div><div class="l">Crediti spesi</div></div>
      <div class="scard"><div class="v" id="sumLeft">500</div><div class="l">Crediti residui</div></div>
    </div>
    <div id="tblslot4"></div>
    <button class="addrow-btn" data-addrow="4">+ Aggiungi riga manuale</button>
  </div>`;
  main.innerHTML = html;

  PAGES.forEach(p => {
    const slot = document.getElementById('slot'+p.id);
    p.reparti.forEach(rep => slot.appendChild(blocks[rep]));
  });
}

function rebuild(){
  const active = (document.querySelector('.page.active') || {}).id || 'page1';
  renderShell();
  const el = document.getElementById(active);
  (el || document.getElementById('page1')).classList.add('active');
  applyStatusToDOM();
  renderTables();
  updateFasceInfo();
}

// ---------------- tabelle acquisti ----------------
function renderTables(){
  autosave();
  PAGES.forEach(p => {
    const rows = purchases.filter(pu => p.reparti.includes(pu.ruolo));
    document.getElementById('tblslot'+p.id).innerHTML = tableHTML(rows);
    document.getElementById('sub'+p.id).textContent = rows.reduce((s,r) => s + (+r.speso||0), 0);
  });
  document.getElementById('tblslot4').innerHTML = tableHTML(purchases);
  const totSpent = purchases.reduce((s,r) => s + (+r.speso||0), 0);
  const left = BUDGET - totSpent;
  document.getElementById('sumBought').textContent = purchases.length;
  document.getElementById('sumSpent').textContent = totSpent;
  document.getElementById('sumLeft').textContent = left;
  const bn = document.getElementById('budgetNum');
  bn.textContent = left;
  bn.classList.toggle('neg', left < 0);
}

function tableHTML(rows){
  const head = `<thead><tr><th class="col-n">#</th><th>Giocatore</th><th>Ruolo</th><th>Spesi</th><th>Residuo</th><th class="col-del"></th></tr></thead>`;
  if(!rows.length) return `<table class="acq">${head}
    <tbody><tr class="empty-row"><td colspan="6">Nessun giocatore ancora — doppio clic su un nome per comprarlo</td></tr></tbody></table>`;
  // il residuo è sempre calcolato sul totale speso, non solo sulle righe mostrate
  const spentBefore = id => purchases.slice(0, purchases.findIndex(p => p.id === id) + 1)
                                     .reduce((s,r) => s + (+r.speso||0), 0);
  const trs = rows.map((r,i) => {
    const repOpts = REPS.map(k => `<option value="${k}" ${k===r.ruolo?'selected':''}>${k}</option>`).join('');
    return `<tr data-id="${r.id}">
      <td class="col-n">${i+1}</td>
      <td><input type="text" value="${esc(r.nome)}" data-f="nome"></td>
      <td><select data-f="ruolo">${repOpts}</select></td>
      <td><input type="number" value="${r.speso}" min="0" data-f="speso"></td>
      <td>${BUDGET - spentBefore(r.id)}</td>
      <td class="col-del"><button class="del-btn" data-del="${r.id}" title="Elimina">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button></td>
    </tr>`;
  }).join('');
  return `<table class="acq">${head}<tbody>${trs}</tbody></table>`;
}

function applyStatusToDOM(){
  document.querySelectorAll('.prow').forEach(row => {
    const s = status[row.getAttribute('data-key')];
    row.classList.toggle('out', !!(s && s.out));
    row.classList.toggle('target', !!(s && s.target && !s.out));
    row.classList.toggle('purchased', !!(s && s.purchased));
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------------- eventi checklist ----------------
document.addEventListener('click', e => {
  const flag = e.target.closest('.flag');
  if(flag){
    const row = flag.closest('.prow');
    if(row.classList.contains('purchased')) return;
    const k = row.getAttribute('data-key');
    status[k] = status[k] || {};
    status[k].out = !status[k].out;
    if(status[k].out) status[k].target = false;
    applyStatusToDOM(); autosave();
    return;
  }
  const nameEl = e.target.closest('.prow .pname');
  if(nameEl){
    const row = nameEl.closest('.prow');
    if(row.classList.contains('out') || row.classList.contains('purchased')) return;
    const k = row.getAttribute('data-key');
    status[k] = status[k] || {};
    status[k].target = !status[k].target;
    applyStatusToDOM(); autosave();
    return;
  }
  const del = e.target.closest('[data-del]');
  if(del){
    const id = +del.getAttribute('data-del');
    const p = purchases.find(x => x.id === id);
    if(p && p.key && status[p.key]){
      status[p.key].out = false; status[p.key].target = false; status[p.key].purchased = false;
    }
    purchases = purchases.filter(x => x.id !== id);
    applyStatusToDOM(); renderTables();
    return;
  }
  const add = e.target.closest('[data-addrow]');
  if(add){
    const pid = add.getAttribute('data-addrow');
    const rep = pid === '4' ? 'POR' : PAGES.find(p => p.id == pid).reparti[0];
    purchases.push({id:uid++, nome:'', ruolo:rep, speso:0, key:null});
    renderTables();
    return;
  }
  const q = e.target.closest('.qpill');
  if(q){
    const el = document.querySelector(q.getAttribute('data-target'));
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if(e.target.closest('[data-open-fasce]')) openFasce();
});

document.addEventListener('dblclick', e => {
  const nameEl = e.target.closest('.prow .pname');
  if(!nameEl) return;
  const row = nameEl.closest('.prow');
  if(row.classList.contains('out') || row.classList.contains('purchased')) return;
  pendingKey = row.getAttribute('data-key');
  pendingName = row.getAttribute('data-nome');
  document.getElementById('modalName').textContent = pendingName;
  const inp = document.getElementById('modalCredits');
  inp.value = '';
  document.getElementById('overlay').classList.add('show');
  setTimeout(() => inp.focus(), 80);
});

document.getElementById('btnCancel').onclick = () => document.getElementById('overlay').classList.remove('show');
document.getElementById('overlay').addEventListener('click', e => {
  if(e.target.id === 'overlay') e.currentTarget.classList.remove('show');
});

document.getElementById('btnConfirm').onclick = () => {
  if(!pendingKey) return;
  const row = document.querySelector(`.prow[data-key="${CSS.escape(pendingKey)}"]`);
  const rep = row ? row.getAttribute('data-rep') : 'POR';
  const cred = Math.max(0, +document.getElementById('modalCredits').value || 0);
  status[pendingKey] = status[pendingKey] || {};
  status[pendingKey].out = true;
  status[pendingKey].purchased = true;
  status[pendingKey].target = false;
  purchases.push({id:uid++, nome:pendingName, ruolo:rep, speso:cred, key:pendingKey});
  applyStatusToDOM(); renderTables();
  document.getElementById('overlay').classList.remove('show');
  toast('Acquistato: ' + pendingName + ' — ' + cred + ' cr.');
  pendingKey = null;
};

document.addEventListener('input', e => {
  const f = e.target.getAttribute('data-f');
  if(!f) return;
  const p = purchases.find(x => x.id === +e.target.closest('tr').getAttribute('data-id'));
  if(!p) return;
  p[f] = e.target.value;
  renderTables();
});

// ---------------- squadra e allenatore ----------------
function initials(s){
  const parts = s.trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '⚽';
  return parts.map(w => w[0]).join('').slice(0,2).toUpperCase();
}

function applyIdentity(){
  document.getElementById('dispTeam').textContent = teamName || '—';
  document.getElementById('dispCoach').textContent = coachName || '—';
  document.getElementById('avTeam').textContent = initials(teamName);
  document.title = (teamName ? teamName + ' — ' : '') + 'Regia Asta';
}

function openSetup(first){
  document.getElementById('inTeam').value = teamName;
  document.getElementById('inCoach').value = coachName;
  document.getElementById('setupErr').textContent = '';
  document.getElementById('btnSetupCancel').hidden = !!first;
  document.getElementById('setup').classList.add('show');
  setTimeout(() => document.getElementById('inTeam').focus(), 80);
}

document.getElementById('btnSetupOk').onclick = () => {
  const t = document.getElementById('inTeam').value.trim();
  const c = document.getElementById('inCoach').value.trim();
  if(!t || !c){
    document.getElementById('setupErr').textContent = 'Compila entrambi i campi per continuare.';
    return;
  }
  teamName = t; coachName = c;
  applyIdentity(); autosave();
  document.getElementById('setup').classList.remove('show');
  document.getElementById('app').classList.add('show');
};
document.getElementById('btnSetupCancel').onclick = () => document.getElementById('setup').classList.remove('show');
document.getElementById('identity').onclick = () => openSetup(false);

// ---------------- fasce: modalità e editor ----------------
function countAssigned(rep){ return Object.keys(myFasce()[rep] || {}).length; }

function updateFasceInfo(){
  const info = document.getElementById('fasceInfo');
  if(fasceMode === 'custom'){
    const tot = REPS.reduce((s,r) => s + countAssigned(r), 0);
    info.textContent = `${tot} giocatori nelle tue fasce · su 565 del listone`;
  } else {
    info.textContent = 'Fasce consigliate — puoi comporre le tue quando vuoi';
  }
  document.querySelectorAll('#fasceSeg .segb').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-mode') === fasceMode);
  });
}

document.getElementById('fasceSeg').addEventListener('click', e => {
  const b = e.target.closest('.segb');
  if(!b) return;
  fasceMode = b.getAttribute('data-mode');
  rebuild(); autosave();
  toast(fasceMode === 'custom' ? 'Tabellone sulle tue fasce' : 'Tabellone sulle fasce consigliate');
});

let fRep = 'POR', fascheDirty = false;

function openFasce(){
  fascheDirty = false;
  renderFasce();
  document.getElementById('fasceOverlay').classList.add('show');
}
function closeFasce(){
  document.getElementById('fasceOverlay').classList.remove('show');
  if(fascheDirty && fasceMode !== 'custom'){
    fasceMode = 'custom';
    toast('Tabellone sulle tue fasce');
  }
  rebuild(); autosave();
}
document.getElementById('btnEditFasce').onclick = openFasce;
document.getElementById('btnCloseFasce').onclick = closeFasce;
document.getElementById('btnDoneFasce').onclick = closeFasce;
document.getElementById('fasceOverlay').addEventListener('click', e => {
  if(e.target.id === 'fasceOverlay') closeFasce();
});

document.getElementById('fRepTabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if(!b) return;
  fRep = b.getAttribute('data-rep');
  document.querySelectorAll('#fRepTabs .tab').forEach(t => t.classList.toggle('active', t === b));
  renderFasce();
});
document.getElementById('fSearch').addEventListener('input', renderFasce);
document.getElementById('fFilter').addEventListener('change', renderFasce);

document.getElementById('btnPrefill').onclick = () => {
  myFasce()[fRep] = Object.assign({}, PREFILL[fRep]);
  fascheDirty = true;
  renderFasce(); autosave();
  toast('Fasce consigliate riprese per ' + REP_LABEL[fRep]);
};
document.getElementById('btnClearRep').onclick = () => {
  myFasce()[fRep] = {};
  fascheDirty = true;
  renderFasce(); autosave();
  toast(REP_LABEL[fRep] + ': fasce svuotate');
};

function renderFasce(){
  const map = myFasce()[fRep] || {};
  const term = document.getElementById('fSearch').value.trim().toUpperCase();
  const filter = document.getElementById('fFilter').value;
  const rows = MASTER[fRep].filter(([nome, team]) => {
    if(term && !(nome.includes(term) || team.includes(term))) return false;
    if(filter === 'assigned' && !map[nome]) return false;
    if(filter === 'free' && map[nome]) return false;
    return true;
  });
  const body = rows.map(([nome, team, eta, q]) => {
    const cur = map[nome] || '';
    const opts = ['<option value="">— nessuna —</option>']
      .concat(TIERS.map(t => `<option value="${t}" ${t===cur?'selected':''}>${TIER_LABEL[t]}</option>`)).join('');
    return `<tr class="${cur?'assigned':''}">
      <td class="fq">${q}</td>
      <td class="fn">${esc(nome)}</td>
      <td class="fs">${esc(team)}</td>
      <td class="fa">${eta}</td>
      <td class="ff"><select data-fp="${esc(nome)}" class="${cur?'':'none'}">${opts}</select></td>
    </tr>`;
  }).join('');
  document.getElementById('fTable').innerHTML =
    `<thead><tr><th>Qt.</th><th>Giocatore</th><th>Squadra</th><th>Età</th><th>Fascia</th></tr></thead><tbody>${body}</tbody>`;
  document.getElementById('fCount').textContent =
    `${countAssigned(fRep)} in fascia su ${MASTER[fRep].length} ${REP_LABEL[fRep].toLowerCase()} · ${rows.length} mostrati`;
}

document.getElementById('fTable').addEventListener('change', e => {
  const sel = e.target.closest('[data-fp]');
  if(!sel) return;
  const nome = sel.getAttribute('data-fp');
  const map = myFasce()[fRep];
  if(sel.value) map[nome] = sel.value; else delete map[nome];
  fascheDirty = true;
  sel.classList.toggle('none', !sel.value);
  sel.closest('tr').classList.toggle('assigned', !!sel.value);
  document.getElementById('fCount').textContent =
    `${countAssigned(fRep)} in fascia su ${MASTER[fRep].length} ${REP_LABEL[fRep].toLowerCase()}`;
  autosave();
});

// ---------------- salvataggio ----------------
const LS_KEY = 'surraucao_asta_classic_v1';

function snapshot(){
  return {v:2, teamName, coachName, fasceMode, customFasce, status, purchases, uid};
}

function restore(obj){
  if(!obj) return false;
  Object.keys(status).forEach(k => delete status[k]);
  // le chiavi della v1 erano rep|fascia|nome: non sono più valide
  Object.entries(obj.status || {}).forEach(([k,v]) => {
    if(k.split('|').length === 2) status[k] = v;
  });
  purchases = (obj.purchases || []).map(p =>
    Object.assign({}, p, {key: p.key && p.key.split('|').length === 2 ? p.key : null}));
  uid = obj.uid || 1;
  teamName = obj.teamName || '';
  coachName = obj.coachName || '';
  fasceMode = obj.fasceMode === 'custom' ? 'custom' : 'suggested';
  customFasce = obj.customFasce || null;
  return true;
}

function autosave(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(snapshot())); }catch(e){ /* si usa il salvataggio su file */ }
}

function autoload(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return restore(JSON.parse(raw));
  }catch(e){ /* ignorato */ }
  return false;
}

document.getElementById('btnSave').onclick = () => {
  const blob = new Blob([JSON.stringify(snapshot())], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'asta_classic_progresso.json';
  a.click();
  toast('Progresso salvato su file');
};

document.getElementById('btnLoad').onclick = () => document.getElementById('loadFile').click();
document.getElementById('loadFile').onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      restore(JSON.parse(reader.result));
      applyIdentity(); rebuild(); autosave();
      toast('Progresso caricato');
    }catch(err){ toast('File non valido'); }
  };
  reader.readAsText(file);
  e.target.value = '';
};

// ---------------- tabs ----------------
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  const page = btn.getAttribute('data-page');
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page'+page));
  document.getElementById('subbar').classList.toggle('hide', page === '4');
});

// ---------------- init ----------------
const hadSaved = autoload();
applyIdentity();
rebuild();
document.getElementById('page1').classList.add('active');
if(teamName){
  document.getElementById('app').classList.add('show');
  if(hadSaved) toast('Bentornato, ' + coachName);
} else {
  document.getElementById('app').classList.add('show');
  openSetup(true);
}
</script>
